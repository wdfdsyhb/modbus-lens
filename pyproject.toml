[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-lens"
version = "0.1.0"
description = "Reconnaissance for unknown Modbus RTU devices: slave discovery, register mapping, evidence-based probing."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["modbus", "rtu", "uart", "industrial", "iot", "reconnaissance"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Communications",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
modbus-lens = "modbus_lens:main"

[tool.setuptools]
py-modules = ["modbus_lens"]
